[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axion"
version = "1.1.0"
description = "A local Python terminal app with AI Core, projects, tasks, apps, safe commands, safe file management, voice output, and browser research for Axion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
